name: cache 
on:
    workflow_dispatch:

jobs:
    deploy-app:
     runs-on: ubuntu-latest
     steps:
     - name: checkout_code
       uses: actions/checkout@v7
     - name: setting python
       uses: actions/setup-python@v7
       with:
        python-version: '3.13' 
     - name: pip cache
       id: pip-cache
       uses: actions/cache@v6
       with:
        path: ~/.cache/pip
        key: pip-cache-${{ hashfiles('requirements.txt') }}
     - name: Retrive cache
       run: |
        echo "cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}"
     - name: Installing dependency
       run: |
         pip install -r requirements.txt

    retrive-cache:
     needs: deploy-app
     runs-on: ubuntu-latest
     steps:
     - name: checkout_code
       uses: actions/checkout@v7
     - name: setting python
       uses: actions/setup-python@v7
       with:
        python-version: '3.13' 
     - name: pip cache
       id: pip-cache
       uses: actions/cache@v6
       with:
        path: ~/.cache/pip
        key: pip-cache-${{ hashfiles('requirements.txt') }}
     - name: Retrive cache
       run: |
        echo "cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}"
     - name: Installing dependency
       run: |
         pip install -r requirements.txt

        

    
       
       