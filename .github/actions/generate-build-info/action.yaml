name: Build info

inputs:
   application_name:
      required: true
      type: string
   application_url:
      required: true
      type: string

outputs:
   build-info-path:
      value: output/info.txt

jobs:
  using: composite
  steps:
  - name: displaying build info
    runs: |
      set -e
      echo "application_name: ${{ inputs.application_name }}"
      echo "application_url: ${{inputs.application_url}}"
      echo "BUild Number: ${{ github.run_number }}"

      echo "----------Displaying output file------------"
      cat output/info.txt
      echo "---------------------------------------------"
