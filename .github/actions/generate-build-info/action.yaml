name: Build info

description: Reusable build info

inputs:
   application_name:
      required: true
      type: string
   application_url:
      required: true
      type: string

outputs:
   build-info-path:
      value: output/info.txt

runs:
  using: composite
  steps:
  - name: displaying build info
    shell: bash
    run: |
      set -e

      cat << EOF > output/info.txt
      echo "application_name: ${{ inputs.application_name }}"
      echo "application_url: ${{ inputs.application_url}}"
      echo "BUild Number: ${{ github.run_number }}"
      EOF
      
      echo "----------Displaying output file------------"
      cat output/info.txt
      echo "---------------------------------------------"
